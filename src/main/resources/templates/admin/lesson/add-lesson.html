<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{layout :: headMeta}"></th:block>
    <title th:text="${lessonDTO.id == null ? 'Thêm Bài Học Mới' : 'Chỉnh Sửa Bài Học'} + ' - CMS'"></title>

    <th:block th:replace="~{layout :: headCoreCss}"></th:block>
    <!-- CSS đồng bộ hệ thống -->
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/pages/admin-sidebar.css}">
</head>

<body>

<th:block th:replace="~{layout :: siteHeader(isTransparent=false)}"></th:block>

<div class="profile-dashboard-wrapper">
    <!-- Hero Area -->
    <div class="profile-hero" style="background: linear-gradient(135deg, #0d47a1 0%, #42a5f5 100%);">
        <div class="profile-hero-content">
            <h1 th:if="${lessonDTO.id == null}"><i class="fas fa-plus-circle"></i> Create Lesson</h1>
            <h1 th:if="${lessonDTO.id != null}"><i class="fas fa-edit"></i> Edit Lesson</h1>
            <p th:text="${lessonDTO.id == null ? 'Bổ sung bài giảng mới vào giáo trình' : 'Cập nhật nội dung bài giảng hiện tại'}"></p>
        </div>
    </div>

    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="dashboard-sidebar">
            <div th:replace="~{admin/fragments/sidebar :: sidebar(${activeMenu})}"></div>
        </aside>

        <!-- Main Content Area -->
        <main class="dashboard-main-content">

            <!-- Thông tin khóa học đang chọn (Chỉ hiện khi thêm từ trang chi tiết khóa học) -->
            <div class="bg-white shadow-sm p-4 mb-4" style="border-radius: 20px;" th:if="${courseTitle != null}">
                <div class="d-flex align-items-center">
                    <div class="rounded-circle bg-primary-light p-3 me-3 text-primary">
                        <i class="fas fa-graduation-cap fs-4"></i>
                    </div>
                    <div>
                        <h5 class="fw-bold mb-1" th:text="${courseTitle}">Course Name</h5>
                        <p class="text-muted mb-0 small">Bạn đang thêm nội dung cho khóa học này</p>
                    </div>
                </div>
            </div>

            <div class="bg-white shadow-sm p-4" style="border-radius: 20px;">
                <form th:action="${lessonDTO.id == null ? '/admin/save-lesson' : '/admin/update-lesson'}"
                      th:object="${lessonDTO}" method="post" id="lessonForm" novalidate>

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" th:field="*{id}" />

                    <!-- Section 1: Phân loại & Cấu trúc -->
                    <div class="row mb-4">
                        <div class="col-12 border-bottom pb-2 mb-4">
                            <h4 class="fw-bold text-primary"><i class="fas fa-layer-group me-2"></i>Cấu Trúc Giáo Trình</h4>
                        </div>

                        <!-- Course select (Chỉ hiện nếu không đi từ trang chi tiết khóa học) -->
                        <div th:if="${courses != null}" class="col-md-6 mb-3">
                            <label for="courseSelect" class="form-label fw-bold">Khóa Học <span class="text-danger">*</span></label>
                            <select id="courseSelect" th:field="*{courseId}" class="form-select rounded-pill px-4"
                                    th:classappend="${#fields.hasErrors('courseId')} ? 'is-invalid' : ''" required>
                                <option value="">-- Chọn Khóa Học --</option>
                                <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.title}"></option>
                            </select>
                            <div th:if="${#fields.hasErrors('courseId')}" th:errors="*{courseId}" class="invalid-feedback d-block ms-3"></div>
                        </div>
                        <input th:unless="${courses != null}" type="hidden" th:field="*{courseId}">

                        <!-- Section Selection -->
                        <div class="col-md-6 mb-3">
                            <label for="sectionId" class="form-label fw-bold">Chương Học (Tùy chọn)</label>
                            <select id="sectionId" th:field="*{sectionId}" class="form-select rounded-pill px-4"
                                    style="background-color: #f8fafc;">
                                <option value="">-- Để trống (Chưa phân chương) --</option>
                                <option th:each="sec : ${sections}" th:value="${sec.id}" th:text="${sec.title}"></option>
                            </select>
                        </div>
                    </div>

                    <!-- Section 2: Nội dung chính -->
                    <div class="row mb-4">
                        <div class="col-12 border-bottom pb-2 mb-4">
                            <h4 class="fw-bold text-primary"><i class="fas fa-file-alt me-2"></i>Nội Dung Bài Giảng</h4>
                        </div>

                        <div class="col-md-12 mb-3">
                            <label for="title" class="form-label fw-bold">Tên Bài Học <span class="text-danger">*</span></label>
                            <input type="text" id="title" th:field="*{title}" class="form-control rounded-pill px-4"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                                   placeholder="Ví dụ: Giới thiệu về DOM trong Javascript" required>
                            <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="invalid-feedback d-block ms-3"></div>
                        </div>

                        <div class="col-md-8 mb-3">
                            <label for="videoUrl" class="form-label fw-bold">Link Video (YouTube/Vimeo)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0" style="border-radius: 50px 0 0 50px;"><i class="fas fa-play text-danger"></i></span>
                                <input type="url" id="videoUrl" th:field="*{videoUrl}" class="form-control border-start-0 px-3"
                                       style="border-radius: 0 50px 50px 0;" placeholder="Dán liên kết video tại đây...">
                            </div>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="duration" class="form-label fw-bold">Thời Lượng (mm:ss)</label>
                            <div class="input-group">
                                <input type="text" id="duration" th:field="*{duration}" class="form-control px-4"
                                       style="border-radius: 50px 0 0 50px;" placeholder="00:00">
                                <button type="button" id="btn-auto-duration" class="btn btn-outline-primary px-3"
                                        style="border-radius: 0 50px 50px 0;">
                                    <i class="fas fa-magic"></i> Tự lấy
                                </button>
                            </div>
                            <div id="duration-loading" class="small text-primary mt-1 ms-2" style="display: none;">
                                <i class="fas fa-spinner fa-spin me-1"></i> Đang phân tích video...
                            </div>
                        </div>
                    </div>

                    <!-- Video Preview Area -->
                    <div class="row mb-4" id="videoPreview" style="display: none;">
                        <div class="col-12">
                            <div class="rounded-4 overflow-hidden border shadow-sm">
                                <div class="bg-light p-2 border-bottom d-flex justify-content-between align-items-center">
                                    <span class="small fw-bold ms-2"><i class="fas fa-eye me-2"></i>Xem trước hiển thị</span>
                                    <button type="button" class="btn-close small me-2" onclick="document.getElementById('videoPreview').style.display='none'"></button>
                                </div>
                                <div class="ratio ratio-16x9">
                                    <iframe id="videoFrame" src="" allowfullscreen></iframe>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tips Section (Gọn gàng hơn) -->
                    <div class="row mb-4">
                        <div class="col-12">
                            <div class="p-3 rounded-4" style="background-color: #fff9f0; border: 1px dashed #ffcc80;">
                                <h6 class="fw-bold text-warning-emphasis mb-2"><i class="fas fa-lightbulb me-2"></i>Mẹo nhỏ cho bài giảng hay:</h6>
                                <div class="row text-muted small">
                                    <div class="col-md-3 mb-2 mb-md-0"><i class="fas fa-check me-1"></i> Tên bài học ngắn gọn</div>
                                    <div class="col-md-3 mb-2 mb-md-0"><i class="fas fa-check me-1"></i> Thời lượng 10-20 phút</div>
                                    <div class="col-md-3 mb-2 mb-md-0"><i class="fas fa-check me-1"></i> Video chất lượng HD</div>
                                    <div class="col-md-3"><i class="fas fa-check me-1"></i> Đặt ở chương phù hợp</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="row mt-4">
                        <div class="col-12 text-end">
                            <hr class="mb-4">
                            <a th:href="${courseId != null ? '/admin/' + courseId : '/admin/lesson-list'}" class="btn btn-light rounded-pill px-4 me-2">Quay Lại</a>
                            <button type="submit" class="btn btn-primary rounded-pill px-5">
                                <i class="fas fa-save me-2"></i>Lưu Bài Học
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<th:block th:replace="~{layout :: siteFooter}"></th:block>
<th:block th:replace="~{layout :: coreScripts}"></th:block>
<script th:src="@{/js/pages/add-lesson.js}"></script>

</body>
</html>
