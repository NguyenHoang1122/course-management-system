<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{layout :: headMeta}"></th:block>
    <title>Thông Tin Cá Nhân - Course Management System</title>

    <th:block th:replace="~{layout :: headCoreCss}"></th:block>
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/pages/admin-sidebar.css}">
</head>
<body>

<!-- Thêm Header trang web -->
<th:block th:replace="~{layout :: siteHeader(isTransparent=false)}"></th:block>

<div class="profile-dashboard-wrapper">
    <!-- HERO Section với màu xanh chuyên nghiệp -->
    <div class="profile-hero" style="background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);">
        <div class="profile-hero-content">
            <h1><i class="fas fa-user-circle"></i> Hồ Sơ Quản Trị</h1>
            <p>Quản lý thông tin cá nhân và thiết lập tài khoản của bạn</p>
        </div>
    </div>

    <div class="dashboard-container">
        <!-- SIDEBAR -->
        <aside class="dashboard-sidebar">
            <div th:replace="~{admin/fragments/sidebar :: sidebar(${activeMenu})}"></div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="dashboard-main-content">

            <!-- Alert Thông báo -->
            <div th:if="${param.updated}" class="alert alert-success mb-4 shadow-sm" style="border-radius: 12px;">
                <i class="fas fa-check-circle me-2"></i>
                <span>Cập nhật thông tin tài khoản thành công!</span>
            </div>

            <div class="row g-4">
                <!-- Cột trái: Card Avatar -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm" style="border-radius: 20px; overflow: hidden;">
                        <div class="card-body text-center py-5">
                            <div class="position-relative d-inline-block mb-3">
                                <img th:src="${!#strings.isEmpty(user.avatar) ? user.avatar : 'https://via.placeholder.com/150'}"
                                     alt="Avatar"
                                     class="img-fluid rounded-circle shadow-sm"
                                     style="width: 150px; height: 150px; object-fit: cover; border: 4px solid #fff;">
                            </div>

                            <h4 class="fw-bold mb-1" th:text="${user.fullName}">Full Name</h4>
                            <p class="text-muted mb-4" th:text="'@' + ${user.userName}">@username</p>

                            <div class="d-grid gap-2 px-3">
                                <a th:href="@{/admin/profile/edit}" class="btn btn-primary rounded-pill">
                                    <i class="fas fa-user-edit me-2"></i>Chỉnh sửa hồ sơ
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cột phải: Thông tin chi tiết -->
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm h-100" style="border-radius: 20px;">
                        <div class="card-header bg-transparent border-0 pt-4 px-4">
                            <h4 class="fw-bold text-dark mb-0">
                                <i class="fas fa-id-card text-primary me-2"></i>Thông tin chi tiết
                            </h4>
                        </div>
                        <div class="card-body p-4">
                            <div class="row mb-4">
                                <div class="col-sm-4 text-muted">Họ và tên</div>
                                <div class="col-sm-8 fw-semibold" th:text="${user.fullName}">-</div>
                            </div>
                            <hr class="opacity-10">
                            <div class="row mb-4">
                                <div class="col-sm-4 text-muted">Địa chỉ Email</div>
                                <div class="col-sm-8 fw-semibold" th:text="${user.email}">-</div>
                            </div>
                            <hr class="opacity-10">
                            <div class="row mb-4">
                                <div class="col-sm-4 text-muted">Số điện thoại</div>
                                <div class="col-sm-8 fw-semibold" th:text="${user.phone}">-</div>
                            </div>
                            <hr class="opacity-10">
                            <div class="row mb-2">
                                <div class="col-sm-4 text-muted">Địa chỉ liên hệ</div>
                                <div class="col-sm-8 fw-semibold" th:text="${user.address}">-</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<th:block th:replace="~{layout :: siteFooter}"></th:block>
<th:block th:replace="~{layout :: coreScripts}"></th:block>

</body>
</html>
