<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{layout :: headMeta}"></th:block>
  <title>Chỉnh Sửa Hồ Sơ - CMS</title>
  <th:block th:replace="~{layout :: headCoreCss}"></th:block>
  <link rel="stylesheet" th:href="@{/css/profile.css}">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/pages/admin-sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/pages/admin-edit.css}">
</head>

<body>
<th:block th:replace="~{layout :: siteHeader(isTransparent=false)}"></th:block>

<div class="profile-dashboard-wrapper">
  <!-- Hero Area -->
  <div class="profile-hero" style="background: linear-gradient(135deg, #2c3e50 0%, #000000 100%);">
    <div class="profile-hero-content">
      <h1><i class="fas fa-user-cog"></i> Account Settings</h1>
      <p>Quản lý thông tin cá nhân và bảo mật tài khoản</p>
    </div>
  </div>

  <div class="dashboard-container">
    <!-- Sidebar Navigation -->
    <aside class="dashboard-sidebar">
      <div th:replace="~{admin/fragments/sidebar :: sidebar(${activeMenu})}"></div>
    </aside>

    <!-- Main Content Area -->
    <main class="dashboard-main-content">
      <!-- Alert Messages -->
      <div class="mb-4">
        <div th:if="${updateError != null or changePasswordError != null}" class="alert alert-danger rounded-4 shadow-sm" role="alert">
          <i class="fas fa-exclamation-circle me-2"></i>
          <span th:text="${!#strings.isEmpty(updateError) ? updateError : changePasswordError}"></span>
        </div>
        <div th:if="${param.passwordUpdated != null or param.updated != null}" class="alert alert-success rounded-4 shadow-sm" role="alert">
          <i class="fas fa-check-circle me-2"></i>
          <span>Cập nhật thành công!</span>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <!-- Profile Form -->
          <div class="bg-white shadow-sm p-4 mb-4" style="border-radius: 20px;">
            <h5 class="fw-bold mb-4"><i class="fas fa-id-card text-primary me-2"></i>Thông Tin Cá Nhân</h5>

            <form id="profileForm" th:action="@{/admin/profile/edit}" th:object="${userProfileDTO}" method="post" enctype="multipart/form-data" novalidate>
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

              <div class="row g-3">
                <!-- Tên đăng nhập (Readonly) -->
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-bold small">Tên Đăng Nhập</label>
                  <input type="text" class="form-control rounded-pill px-3 bg-light" th:value="${user.userName}" readonly>
                </div>

                <!-- Họ tên -->
                <div class="col-md-6 mb-3">
                  <label for="pFullName" class="form-label fw-bold small">Họ Và Tên <span class="text-danger">*</span></label>
                  <input type="text" id="pFullName" th:field="*{fullName}" class="form-control rounded-pill px-3" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''">
                  <div class="invalid-feedback ms-2" id="err-pFullName-msg" th:errors="*{fullName}"></div>
                </div>

                <!-- Email -->
                <div class="col-md-6 mb-3">
                  <label for="pEmail" class="form-label fw-bold small">Email <span class="text-danger">*</span></label>
                  <input type="email" id="pEmail" th:field="*{email}" class="form-control rounded-pill px-3">
                  <div class="invalid-feedback ms-2" id="err-pEmail-msg"></div>
                </div>

                <!-- Số điện thoại -->
                <div class="col-md-6 mb-3">
                  <label for="pPhone" class="form-label fw-bold small">Số Điện Thoại</label>
                  <input type="text" id="pPhone" th:field="*{phone}" class="form-control rounded-pill px-3">
                  <div class="invalid-feedback ms-2" id="err-pPhone-msg"></div>
                </div>

                <!-- Avatar Upload (New Field Integrated) -->
                <div class="col-12 mb-3">
                  <label for="avatarFile" class="form-label fw-bold small">Ảnh Đại Diện</label>
                  <div class="d-flex align-items-center gap-3">
                    <div class="flex-grow-1">
                      <input type="file" id="avatarFile" name="avatarFile" class="form-control rounded-pill px-3" accept="image/*">
                      <div class="invalid-feedback ms-2" id="err-avatar-msg"></div>
                    </div>
                  </div>
                  <!-- Preview ảnh mới chọn -->
                  <div id="avatarPreviewBox" class="mt-3" style="display: none;">
                    <div class="d-flex align-items-center p-2 border rounded-4 bg-light">
                      <img id="avatarPreviewImg" src="" style="width: 50px; height: 50px; border-radius: 10px; object-fit: cover;" class="me-3">
                      <span class="small text-success fw-bold"><i class="fas fa-check"></i> Ảnh mới đã sẵn sàng để tải lên</span>
                    </div>
                  </div>
                </div>

                <!-- Địa chỉ -->
                <div class="col-12 mb-3">
                  <label for="pAddress" class="form-label fw-bold small">Địa Chỉ</label>
                  <input type="text" id="pAddress" th:field="*{address}" class="form-control rounded-pill px-3">
                  <div class="invalid-feedback ms-2" id="err-pAddress-msg"></div>
                </div>

                <div class="col-12 text-end mt-4">
                  <hr>
                  <a th:href="@{/admin/profile}" class="btn btn-light rounded-pill px-4 me-2">Hủy</a>
                  <button type="submit" class="btn btn-primary rounded-pill px-4">Lưu Thay Đổi</button>
                </div>
              </div>
            </form>
          </div>

          <!-- Change Password Form -->
          <div class="bg-white shadow-sm p-4" style="border-radius: 20px;">
            <h5 class="fw-bold mb-4"><i class="fas fa-shield-alt text-success me-2"></i>Bảo Mật & Mật Khẩu</h5>
            <form id="changePasswordForm" th:action="@{/admin/profile/change-password}" method="post" novalidate>
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

              <div class="mb-4">
                <label for="currentPassword" class="form-label fw-bold small">Mật Khẩu Hiện Tại</label>
                <div class="input-group">
                  <input type="password" id="currentPassword" name="currentPassword" class="form-control border-end-0 px-3" style="border-radius: 50px 0 0 50px;">
                  <span class="input-group-text bg-white border-start-0" style="border-radius: 0 50px 50px 0; cursor: pointer;" onclick="togglePw('currentPassword', this)">
                                        <i class="fas fa-eye text-muted"></i>
                                    </span>
                </div>
                <div class="invalid-feedback ms-2" id="err-currentPassword-msg"></div>
              </div>

              <div class="mb-4">
                <label for="newPassword" class="form-label fw-bold small">Mật Khẩu Mới</label>
                <div class="input-group">
                  <input type="password" id="newPassword" name="newPassword" class="form-control border-end-0 px-3" style="border-radius: 50px 0 0 50px;">
                  <span class="input-group-text bg-white border-start-0" style="border-radius: 0 50px 50px 0; cursor: pointer;" onclick="togglePw('newPassword', this)">
                                        <i class="fas fa-eye text-muted"></i>
                                    </span>
                </div>
                <div class="mt-2 px-2">
                  <div class="pw-strength-bar bg-light rounded-pill" id="cpStrengthBar" style="height: 6px; display: none;">
                    <div class="fill rounded-pill" id="cpStrengthFill" style="height: 100%; width: 0%; transition: all 0.3s ease;"></div>
                  </div>
                  <div id="cpStrengthLabel" class="small mt-1"></div>
                </div>
                <div class="pw-requirements mt-2 small text-muted px-2">
                  <ul class="list-unstyled d-flex flex-wrap gap-3 mb-0">
                    <li id="cp-req-length"><i class="fas fa-circle me-1" style="font-size: 8px;"></i>8+ ký tự</li>
                    <li id="cp-req-upper"><i class="fas fa-circle me-1" style="font-size: 8px;"></i>1 Chữ hoa</li>
                    <li id="cp-req-digit"><i class="fas fa-circle me-1" style="font-size: 8px;"></i>1 Số</li>
                  </ul>
                </div>
                <div class="invalid-feedback ms-2" id="err-newPassword-msg"></div>
              </div>

              <div class="mb-4">
                <label for="cpConfirmPassword" class="form-label fw-bold small">Xác Nhận Mật Khẩu</label>
                <input type="password" id="cpConfirmPassword" name="confirmPassword" class="form-control rounded-pill px-3">
                <div class="invalid-feedback ms-2" id="err-cpConfirmPassword-msg"></div>
              </div>

              <div class="text-end mt-4">
                <button type="submit" class="btn btn-success rounded-pill px-4">Cập Nhật Mật Khẩu</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<th:block th:replace="~{layout :: siteFooter}"></th:block>
<th:block th:replace="~{layout :: coreScripts}"></th:block>
<script th:src="@{/js/pages/admin-edit.js}"></script>
</body>
</html>
