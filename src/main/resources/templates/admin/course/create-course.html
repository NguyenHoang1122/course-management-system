<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{layout :: headMeta}"></th:block>
    <title>Tạo Khóa Học Mới - Course Management System</title>

    <th:block th:replace="~{layout :: headCoreCss}"></th:block>
    <!-- Thêm CSS đồng bộ -->
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/pages/admin-sidebar.css}">
</head>

<body>

<th:block th:replace="~{layout :: siteHeader(isTransparent=false)}"></th:block>

<div class="profile-dashboard-wrapper">
    <!-- Hero Area: Đồng bộ phong cách Admin -->
    <div class="profile-hero" style="background: linear-gradient(135deg, #1a237e 0%, #4285f4 100%);">
        <div class="profile-hero-content">
            <h1><i class="fas fa-plus-circle"></i> Create New Course</h1>
            <p>Thiết lập và phát hành nội dung đào tạo mới</p>
        </div>
    </div>

    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="dashboard-sidebar">
            <div th:replace="~{admin/fragments/sidebar :: sidebar(${activeMenu})}"></div>
        </aside>

        <!-- Main Content Area -->
        <main class="dashboard-main-content">
            <div class="bg-white shadow-sm p-4" style="border-radius: 20px;">

                <form th:action="@{/admin/save-course}" th:object="${courseDTO}" method="post" id="courseForm" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" th:field="*{id}">

                    <!-- Section 1: Thông tin cơ bản -->
                    <div class="row mb-4">
                        <div class="col-12 border-bottom pb-2 mb-4">
                            <h4 class="fw-bold text-primary"><i class="fas fa-info-circle me-2"></i>Thông Tin Cơ Bản</h4>
                        </div>

                        <div class="col-md-12 mb-3">
                            <label for="title" class="form-label fw-bold">Tên Khóa Học <span class="text-danger">*</span></label>
                            <input type="text" id="title" th:field="*{title}" class="form-control rounded-pill px-4"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''" placeholder="Nhập tên khóa học" required>
                            <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="invalid-feedback d-block ms-3"></div>
                        </div>

                        <div class="col-md-12 mb-3">
                            <label for="description" class="form-label fw-bold">Mô Tả Khóa Học <span class="text-danger">*</span></label>
                            <textarea id="description" th:field="*{description}" class="form-control"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                                      rows="4" style="border-radius: 15px;" placeholder="Nhập mô tả chi tiết..."></textarea>
                            <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="invalid-feedback d-block ms-3"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="price" class="form-label fw-bold">Giá Khóa Học (VND) <span class="text-danger">*</span></label>
                            <input type="number" id="price" th:field="*{price}" class="form-control rounded-pill px-4" required min="0">
                            <small class="text-muted ms-2">Nhập 0 nếu miễn phí</small>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="instructorId" class="form-label fw-bold">Giảng Viên <span class="text-danger">*</span></label>
                            <select id="instructorId" th:field="*{instructorId}" class="form-select rounded-pill px-4" required>
                                <option value="">-- Chọn Giảng Viên --</option>
                                <option th:each="user : ${instructors}" th:value="${user.id}" th:text="${user.fullName}"></option>
                            </select>
                        </div>
                    </div>

                    <!-- Section 2: Media & Phân loại -->
                    <div class="row mb-4">
                        <div class="col-12 border-bottom pb-2 mb-4">
                            <h4 class="fw-bold text-primary"><i class="fas fa-photo-video me-2"></i>Media & Phân Loại</h4>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="category" class="form-label fw-bold">Danh Mục</label>
                            <input type="text" id="category" th:field="*{category}" class="form-control rounded-pill px-4" placeholder="Ví dụ: Web Dev...">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="imageUrl" class="form-label fw-bold">Link Ảnh Thumbnail</label>
                            <input type="url" id="imageUrl" th:field="*{imageUrl}" class="form-control rounded-pill px-4" placeholder="URL ảnh Unsplash...">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="previewVideoUrl" class="form-label fw-bold">Link Video Giới Thiệu</label>
                            <input type="text" id="previewVideoUrl" th:field="*{previewVideoUrl}" class="form-control rounded-pill px-4" placeholder="YouTube/Vimeo link...">
                        </div>
                    </div>

                    <!-- Section 3: Thông số Premium -->
                    <div class="row mb-4">
                        <div class="col-12 border-bottom pb-2 mb-4">
                            <h4 class="fw-bold text-warning"><i class="fas fa-star me-2"></i>Thông Số Chi Tiết (Premium)</h4>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="level" class="form-label fw-bold">Trình Độ</label>
                            <select id="level" th:field="*{level}" class="form-select rounded-pill px-4">
                                <option value="Tất cả trình độ">Tất cả trình độ</option>
                                <option value="Cơ bản (Beginner)">Cơ bản (Beginner)</option>
                                <option value="Trung cấp (Intermediate)">Trung cấp (Intermediate)</option>
                                <option value="Nâng cao (Advanced)">Nâng cao (Advanced)</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="duration" class="form-label fw-bold">Thời Lượng</label>
                            <input type="text" id="duration" th:field="*{duration}" class="form-control rounded-pill px-4" placeholder="Ví dụ: 15 giờ, 8 tuần...">
                        </div>

                        <div class="col-md-12 mb-3">
                            <label for="learningPoints" class="form-label fw-bold">Kết quả đạt được (Phân cách bằng dấu |)</label>
                            <textarea id="learningPoints" th:field="*{learningPoints}" class="form-control" rows="2" style="border-radius: 15px;" placeholder="Kiến thức A | Kỹ năng B..."></textarea>
                        </div>

                        <div class="col-md-12 mb-3">
                            <label for="requirements" class="form-label fw-bold">Yêu Cầu Đầu Vào (Phân cách bằng dấu |)</label>
                            <textarea id="requirements" th:field="*{requirements}" class="form-control" rows="2" style="border-radius: 15px;" placeholder="Máy tính có JDK | Biết HTML cơ bản..."></textarea>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="row mt-4">
                        <div class="col-12 text-end">
                            <hr class="mb-4">
                            <a th:href="@{/admin/course-list}" class="btn btn-light rounded-pill px-4 me-2">Hủy bỏ</a>
                            <button type="submit" class="btn btn-primary rounded-pill px-5">
                                <i class="fas fa-save me-2"></i>Lưu Khóa Học
                            </button>
                        </div>
                    </div>
                </form>

            </div>

            <!-- Preview Area (Tùy chọn: Có thể giữ hoặc ẩn bớt nếu form quá dài) -->
            <div class="mt-5 mb-4">
                <h5 class="text-muted mb-3"><i class="fas fa-eye me-2"></i>Xem trước hiển thị</h5>
                <div class="dashboard-course-card shadow-sm" style="max-width: 350px;">
                    <div class="db-course-image d-flex align-items-center justify-content-center" style="height: 180px; background: #f8f9fa;">
                        <img id="preview-img" src="" alt="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                        <i id="preview-img-placeholder" class="fas fa-image fa-3x text-light"></i>
                    </div>
                    <div class="db-course-body">
                        <span class="db-course-category" id="preview-category">Category</span>
                        <h4 class="db-course-title" id="preview-title">Tên khóa học</h4>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="fw-bold text-primary" id="preview-price">0 đ</span>
                            <span class="badge bg-light text-muted rounded-pill px-3">Quản lý</span>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<th:block th:replace="~{layout :: siteFooter}"></th:block>
<th:block th:replace="~{layout :: coreScripts}"></th:block>
<script th:src="@{/js/pages/create-course.js}"></script>

</body>

</html>
